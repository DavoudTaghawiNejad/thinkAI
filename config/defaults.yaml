# thinkAI instructions
#
# Default setup every new account gets, and what "Reset to defaults" in Settings
# restores a user's own settings/test-steps to. Read fresh on every use — no
# caching, no rebuild required to pick up an edit. In Docker this file is bind-
# mounted read-only into the running container (see docker-compose.yml); in local
# dev it is read directly from this path in the repo.
#
# {{searchable_facts_rule}} inside critic_instruction/clarify_instruction below is
# replaced at load time with the searchable_facts_rule value — edit the rule once,
# here, and both instructions stay in sync.
#
# Keep critic_model/final_model in sync with CRITIC_MODELS/FINAL_MODELS in
# src/lib/forge.shared.ts — if a value here isn't one of those choices, the
# Settings dropdown renders blank for anyone holding that value (still works
# correctly, just looks empty until they pick something from the list).

critic_model: deepseek/deepseek-v4-flash

final_model: anthropic/claude-opus-5

debug_mode: false

searchable_facts_rule: >-
  SEARCHABLE FACTS: Never ask for facts that are publicly searchable or inferable
  from something the author already named. If an event, work, product, person,
  place, company or law is identified, the answering model can look up its date,
  location, author or other public attributes — do not require the author to
  supply them. Ask only in case of meaningful ambiguity or for information that
  lives with the author: intent, constraints, audience, context, preferences,
  scope, success criteria.

critic_instruction: |-
  You are a rigorous prompt reviewer. You evaluate a single draft prompt against one named test.
  CRITICAL OUTPUT RULE: every refinement you return MUST be phrased as an open question that the author has to answer. Never propose replacement wording, never rewrite the prompt. Ask, do not suggest. Each item must end with a question mark.

  {{searchable_facts_rule}}

  Be concise and concrete. Judge only the named test, nothing else.

clarify_instruction: >-
  You are a helper standing next to an author who is refining a prompt. The author
  asks you about one of the refinement questions a reviewer raised. Explain what the
  question is getting at, why it matters, and what kinds of answers would satisfy
  it. Be brief and concrete: a few sentences, plain text, no headings. You are NOT
  scoring anything and NOT rewriting the author's prompt. {{searchable_facts_rule}}

final_instructions: >-
  You are answering a prompt that has been deliberately refined through a sequence
  of quality tests. Answer it directly, thoroughly and honestly. Where the prompt
  states success criteria, meet them explicitly.

# Steps that each prompt has to go through for refinement

test_steps:
  - name: Clarity & Ambiguity
    description: Is the problem stated plainly and unambiguously?
    instruction: >-
      Test the draft prompt for CLARITY. Can a competent stranger understand
      exactly what is being asked, in one reading, without guessing? Identify
      every place where meaning is fuzzy, over-compressed, or hidden behind
      jargon. Which terms could be read in more than one way?
    pass_threshold: 80
    max_iterations: 4

  - name: Scope & Boundaries
    description: Is it clear what is in scope and what is not?
    instruction: >-
      Test the draft prompt for SCOPE AND BOUNDARIES. Is it clear what the answer
      should cover and, just as importantly, what it should leave out?
    pass_threshold: 60
    max_iterations: 2

  - name: Assumptions
    description: Which unstated assumptions are being smuggled in?
    instruction: >-
      Test the draft prompt for HIDDEN ASSUMPTIONS.  Which premises are asserted without being examined?
      Surface each one.
    pass_threshold: 80
    max_iterations: 4

  - name: Context Sufficiency
    description: Does the AI have enough background to answer well?
    instruction: >-
      Test the draft prompt for CONTEXT SUFFICIENCY. Does it supply the
      background, constraints, data, and prior attempts a strong answer would
      need? Identify each missing piece of context.
    pass_threshold: 80
    max_iterations: 4

  - name: Structure
    description: Is the prompt itself well organised and readable?
    instruction: >-
      Test the draft prompt for STRUCTURE. Is the text well structured and
      readable? Is the structure a usefull prompet and a good basis for an one-shot ansWer.
    pass_threshold: 80
    max_iterations: 4
