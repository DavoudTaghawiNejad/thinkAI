events {}

http {
  # Docker's embedded DNS. Resolving via a variable (below) makes proxy_pass
  # look up the upstream lazily per-request instead of once at config load —
  # otherwise nginx refuses to start at all if auth/rest aren't resolvable yet
  # (e.g. still restarting) when the gateway container boots.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 8000;

    location /auth/v1/ {
      # `set` and `rewrite ... break` are both ngx_http_rewrite_module directives —
      # break halts remaining directives from that module in this location, so
      # `set` must come first or $upstream_auth is left empty.
      set $upstream_auth auth:9999;
      # A variable-based proxy_pass (needed for lazy DNS resolution) does not
      # auto-strip the location prefix like a static proxy_pass would — rewrite
      # explicitly so GoTrue sees /health, not /auth/v1/health.
      rewrite ^/auth/v1/(.*)$ /$1 break;
      proxy_pass http://$upstream_auth;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/v1/ {
      set $upstream_rest rest:3000;
      rewrite ^/rest/v1/(.*)$ /$1 break;
      proxy_pass http://$upstream_rest;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
