# Apache reverse-proxy vhost for thinkAIdevelopment.taghawi-nejad.de -> the
# Docker containers in /root/ThinkAIdevelopment. Mirrors deploy/apache-thinkAI.conf
# for production, but proxies to the dev stack's host ports (3001 app, 8001 gateway).
#
# One-time setup on the VPS:
#   sudo a2enmod proxy proxy_http ssl rewrite headers
#   sudo cp deploy/apache-thinkAIdevelopment.conf /etc/apache2/sites-available/thinkAIdevelopment.conf
#   sudo a2ensite thinkAIdevelopment.conf
#   sudo certbot --apache -d thinkAIdevelopment.taghawi-nejad.de
#   sudo systemctl reload apache2
#
# Prerequisite: a DNS A/AAAA record for thinkAIdevelopment.taghawi-nejad.de pointing at this VPS.

<VirtualHost *:80>
    ServerName thinkAIdevelopment.taghawi-nejad.de
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName thinkAIdevelopment.taghawi-nejad.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/thinkaidevelopment.taghawi-nejad.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/thinkaidevelopment.taghawi-nejad.de/privkey.pem

    ProxyPreserveHost On

    # Supabase auth/rest gateway — must come before the catch-all app proxy below.
    ProxyPass /auth/v1/ http://127.0.0.1:8001/auth/v1/
    ProxyPassReverse /auth/v1/ http://127.0.0.1:8001/auth/v1/
    ProxyPass /rest/v1/ http://127.0.0.1:8001/rest/v1/
    ProxyPassReverse /rest/v1/ http://127.0.0.1:8001/rest/v1/

    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
</VirtualHost>
