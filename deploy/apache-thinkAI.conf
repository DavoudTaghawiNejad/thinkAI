# Apache reverse-proxy vhost for thinkAI.taghawi-nejad.de -> the Docker containers.
# docker-compose.yml binds the app to 127.0.0.1:3000 and the self-hosted Supabase
# auth+rest gateway to 127.0.0.1:8000. Both are fronted on this one public origin —
# the browser's supabase-js client expects one base URL for /auth/v1 and /rest/v1.
#
# One-time setup on the VPS:
#   sudo a2enmod proxy proxy_http ssl rewrite headers
#   sudo cp deploy/apache-thinkAI.conf /etc/apache2/sites-available/thinkAI.conf
#   sudo a2ensite thinkAI.conf
#   sudo certbot --apache -d thinkAI.taghawi-nejad.de
#   sudo systemctl reload apache2
#
# Prerequisite: a DNS A/AAAA record for thinkAI.taghawi-nejad.de pointing at this VPS.

<VirtualHost *:80>
    ServerName thinkAI.taghawi-nejad.de
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName thinkAI.taghawi-nejad.de
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/thinkAI.taghawi-nejad.de/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/thinkAI.taghawi-nejad.de/privkey.pem

    ProxyPreserveHost On

    # Supabase auth/rest gateway — must come before the catch-all app proxy below.
    ProxyPass /auth/v1/ http://127.0.0.1:8000/auth/v1/
    ProxyPassReverse /auth/v1/ http://127.0.0.1:8000/auth/v1/
    ProxyPass /rest/v1/ http://127.0.0.1:8000/rest/v1/
    ProxyPassReverse /rest/v1/ http://127.0.0.1:8000/rest/v1/

    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
